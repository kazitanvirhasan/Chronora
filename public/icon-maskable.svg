<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="msubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#mbg)"/>

  <!-- Centered emblem scaled to 75% to strictly respect the safe zone -->
  <g transform="translate(256, 256) scale(0.75)">
    <circle cx="0" cy="0" r="160" fill="url(#msubtle)"/>

    <!-- Outer hexagon nexus nodes -->
    <circle cx="0" cy="-120" r="14" fill="#22d3ee"/>
    <circle cx="104" cy="-60" r="14" fill="#38bdf8"/>
    <circle cx="104" cy="60" r="14" fill="#3b82f6"/>
    <circle cx="0" cy="120" r="14" fill="#60a5fa"/>
    <circle cx="-104" cy="60" r="14" fill="#3b82f6"/>
    <circle cx="-104" cy="-60" r="14" fill="#38bdf8"/>

    <!-- Connecting nexus lines -->
    <path d="M0 -120 L104 -60 L104 60 L0 120 L-104 60 L-104 -60 Z" 
          fill="none" stroke="url(#mglow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Inner Book / Focus Timer Shape -->
    <path d="M0 45 C -45 15, -75 25, -90 55 L -90 -45 C -75 -75, -45 -85, 0 -55 Z" 
          fill="url(#mglow)" opacity="0.9"/>
    <path d="M0 45 C 45 15, 75 25, 90 55 L 90 -45 C 75 -75, 45 -85, 0 -55 Z" 
          fill="url(#mglow)" opacity="0.9"/>

    <!-- Center Spine & Glow Core -->
    <path d="M0 -75 L0 70" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
    <circle cx="0" cy="0" r="8" fill="#020617"/>
  </g>
</svg>
